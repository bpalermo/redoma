# The redoma services' users and groups (sysusers.d(5)), at fixed ids: the OCI
# hook refuses these ids to every agent container, and SPIRE's entries attest
# the services by uid. The package's postinst checks the ids after
# systemd-sysusers ran and fails if a name already had another one.
#
#   redoma-sds    961  redoma xds, SPIRE's authorized delegate
#   redoma-relay  963  redoma relay; the host Envoy joins its group
#   redoma-lead   964  group: the users who may task agents (add them yourself)
g redoma-sds   961
u redoma-sds   961:961 "redoma xds"   / /usr/sbin/nologin
g redoma-relay 963
u redoma-relay 963:963 "redoma relay" / /usr/sbin/nologin
g redoma-lead  964
