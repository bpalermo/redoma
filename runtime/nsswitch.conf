# Debian's default /etc/nsswitch.conf (base-files' postinst writes it; no
# maintainer script runs in this image), without the db and nis sources,
# whose modules are not installed. /etc/hosts before DNS: localhost never
# waits on a resolver.
passwd:         files
group:          files
shadow:         files
gshadow:        files

hosts:          files dns
networks:       files

protocols:      files
services:      files
ethers:         files
rpc:            files
