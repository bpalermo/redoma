# /etc/redoma/redoma.conf: the settings every redoma command shares. Lines of
# `key = value`; # starts a comment. A command's own flag overrides the file.
# An unknown key or a bad value makes every command refuse to start.

# The agents' and the relay's SPIFFE trust domain. The agents are
# spiffe://<trust_domain>/agent/<name>, the relay
# spiffe://<trust_domain>/host/relay; SPIRE must issue those IDs.
trust_domain = redoma.internal

# The OCI annotation that makes a container an agent: --annotation
# redoma/agent=<name>. The hook definitions in
# /usr/share/containers/oci/hooks.d match this key; change both together.
#agent_annotation = redoma/agent

# The host SPIRE agent's admin socket (redoma xds, as the authorized
# delegate) and its Workload API (redoma relay).
#spire_admin_socket = /run/redoma-spire/admin/admin.sock
#spire_workload_api = unix:///run/redoma-spire/workload/agent.sock
