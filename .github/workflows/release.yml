name: release

# A tag v<VERSION> pushed to this repository publishes a GitHub Release with
# the Debian packages, redoma_<version>_amd64.deb and redoma_<version>_arm64.deb,
# and their SHA256SUMS. A tag v<VERSION>-rc.<n> publishes a release
# candidate the same way, as a prerelease, its packages versioned
# <VERSION>~rc.<n> (AGENTS.md, "The package") and named
# redoma_<VERSION>-rc.<n>_<arch>.deb, a name GitHub keeps. Only the packages: the runtime
# image bundles Claude Code and is never published (AGENTS.md, "The runtime
# image").
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds and tests the packages from the tagged commit and hands them to
  # publish as an artifact. Nothing here can write to the repository.
  build:
    name: build
    if: github.repository == 'bpalermo/redoma'
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # The whole history: the check below needs the path from the tagged
      # commit to main's head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      # The packages' version is VERSION's: a tag that says otherwise would
      # publish packages that disagree with their release. Any other tag
      # matching v* fails here (bazel/release-tag.sh, //bazel:release_tag_test).
      - name: the tag is v<VERSION> or v<VERSION>-rc.<n>
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: bash bazel/release-tag.sh VERSION "${TAG}"

      # Releases are tagged on main, after CI passed there: a tag on any
      # other commit (a branch, a pull request's head) publishes nothing.
      - name: the tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} is not on main: tag a commit of main" >&2
            exit 1
          fi

      # Only the packages' own test, from the tagged commit: their file
      # lists, control fields, stamped version and postinst. Not the rest of
      # what CI's build runs.
      - name: bazel test //deb:deb_test
        run: bazel test --config=ci //deb:deb_test

      # The stamp reads the tag from the checkout (bazel/workspace_status.sh):
      # a tree it does not take for the tagged commit stamps a snapshot
      # version, which this release must not carry. deb_test holds both
      # packages to this file.
      - name: the packages carry the tag's version
        env:
          WANT: ${{ steps.tag.outputs.deb }}
        run: |
          got="$(cat bazel-bin/deb/deb_version.txt)"
          if [[ ${got} != "${WANT}" ]]; then
            echo "::error::the packages are version ${got}, not ${WANT}" >&2
            exit 1
          fi

      # Named as GitHub uploads them: a candidate's 0.1.0~rc.1 package is
      # redoma_0.1.0-rc.1_<arch>.deb, since GitHub would turn the `~` into
      # a `.` and SHA256SUMS would no longer name the downloaded files. A
      # name GitHub would rewrite fails here (bazel/release-assets.sh,
      # //bazel:release_assets_test).
      - name: the packages and their sums
        env:
          OUT: ${{ runner.temp }}/release
          DEB_VERSION: ${{ steps.tag.outputs.deb }}
        run: bash bazel/release-assets.sh "${DEB_VERSION}" bazel-bin/deb "${OUT}"

      - name: upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  # Publishes what build made. The one job that can write, and it runs no
  # build: it does not even check the repository out.
  publish:
    name: publish
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      # The one permission that creates a release; nothing else is written.
      contents: write
    steps:
      - name: download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/release

      - name: the packages are the ones build summed
        working-directory: ${{ runner.temp }}/release
        run: sha256sum --check SHA256SUMS

      # No release of this tag yet, published or draft: a published one is
      # never replaced, and with no draft before this run every draft of
      # the tag below is this run's own, the one the read-back checks and
      # the clean-up deletes. A draft left by an earlier run stops here
      # (AGENTS.md, "Pull requests": a failed release).
      - name: no release of the tag yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          found="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name == env.TAG) | "\(.html_url) draft=\(.draft)"')"
          if [[ -n ${found} ]]; then
            echo "::error::${TAG} already has a release: ${found//$'\n'/, }" >&2
            exit 1
          fi

      # A draft first: the release is published only once GitHub holds its
      # assets under exactly the names and digests SHA256SUMS lists. A
      # mismatch fails the run, and the clean-up deletes the draft.
      - name: draft the release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          OUT: ${{ runner.temp }}/release
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [[ ${PRERELEASE} == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --draft --title "redoma ${TAG}" --generate-notes "${flags[@]}" \
            "${OUT}"/redoma_*.deb "${OUT}/SHA256SUMS"

      # Every asset of the draft, as GitHub holds it, by name and by the
      # sha256 GitHub computed (its `digest`), against SHA256SUMS and the
      # sum of SHA256SUMS itself: nothing renamed, missing, extra or
      # altered.
      - name: the uploaded assets are the ones summed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          OUT: ${{ runner.temp }}/release
        run: |
          id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name == env.TAG and .draft) | .id')"
          if [[ ! ${id} =~ ^[0-9]+$ ]]; then
            echo "::error::want one draft of ${TAG}, found: ${id:-none}" >&2
            exit 1
          fi
          want="$(cd "${OUT}" && { cat SHA256SUMS; sha256sum SHA256SUMS; } | sort)"
          got="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${id}/assets" \
            --jq '.[] | "\(.digest // "no-digest" | ltrimstr("sha256:"))  \(.name)"' | sort)"
          if [[ ${got} != "${want}" ]]; then
            echo "::error::the draft's assets do not match SHA256SUMS (< summed, > uploaded):" >&2
            diff <(echo "${want}") <(echo "${got}") >&2 || true
            exit 1
          fi
          echo "id=${id}" >>"${GITHUB_OUTPUT}"

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.check.outputs.id }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${ID}" \
            -F draft=false --jq '.html_url'

      # A run that fails once the draft step has run deletes the tag's draft,
      # which "no release of the tag yet" proved is this run's own, so the
      # failed jobs can be re-run. Only a draft: a published release is
      # never deleted, and the tag stays.
      - name: delete the draft
        if: failure() && steps.draft.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name == env.TAG and .draft) | .id')"
          for id in ${ids}; do
            release="repos/${GITHUB_REPOSITORY}/releases/${id}"
            # Read again just before: a release published since is kept.
            if [[ "$(gh api "${release}" --jq '.draft')" == true ]]; then
              gh api -X DELETE "${release}"
              echo "deleted the draft ${id} of ${TAG}; the tag stays"
            fi
          done
