# Installed to /etc/containers/containers.conf.d/ (AGENTS.md, "The OCI hook").
#
# Makes sure Podman reads the directory redoma oci-hook's definitions are
# in. hooks_dir already defaults to it (containers/common v0.57.4,
# pkg/config/default.go:77), but any containers.conf that sets hooks_dir
# replaces that default, and Podman skips a hooks directory that is not
# there without a word: the hook would then silently never run.
#
# {append=true} (containers/common internal/attributedstring/slice.go:14-16,
# 74-75) adds the directory to whatever the files read before this one set,
# instead of replacing it. Files read later can still replace it: a drop-in
# sorting after this one, a rootless user's own containers.conf, and
# CONTAINERS_CONF, which replaces every file (pkg/config/new.go:153-186).
[engine]
hooks_dir = ["/usr/share/containers/oci/hooks.d", {append=true}]
