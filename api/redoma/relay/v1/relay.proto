// The protocol between the lead and the agents in their containers.
//
// redoma-shim, in an agent's container, holds ONE long-lived stream,
// Relay.Connect, to 127.0.0.1:7070 in its network namespace. The host
// Envoy's listener there forwards it to redoma-relay over mutual TLS with
// the agent's SVID, so the relay knows the agent from the client certificate
// alone. The lead talks to redoma-relay's Lead service on a local unix
// socket (redoma msg). Routing is lead <-> agent only.
//
// Delivery is at-least-once. Every envelope but an Ack and a Heartbeat has a
// seq, numbered from 1 by its sender for each direction of one agent's
// stream, and kept by the sender on disk until the receiver acks it. An Ack
// is cumulative: it acks every envelope up to its seq. On a reconnect each
// side resends everything not acked, in order, and each receiver drops a seq
// it has already taken (no higher than the last it took).
//
// A sender's numbering lives as long as its queue on disk. Each queue has an
// epoch, a random string made with it: the shim sends its own in the request
// metadata "redoma-epoch", the relay its own in the response header of the
// same name. A receiver that sees a new epoch for its peer starts its count
// again, so a queue made again from nothing (a new workspace, a lost state
// directory) is not taken for one long acked.
//
// The wire format is the proto3 one this file was first written in: every
// singular scalar field has implicit presence (a zero value is not sent), so
// a peer built from either version reads the other.
//
// Presence: every scalar field below has implicit presence, so an unset
// field and a field set to its zero value (0, false, an empty string or
// bytes) are the same and neither is on the wire; each field's comment says
// what its zero value means. A message field, and every member of a oneof,
// has explicit presence: unset is distinct from an empty message.
//
// Sizes are in bytes of the UTF-8 encoding. The limits below are the relay's:
// it drops an agent's envelope over one (and counts it in a Dropped event),
// and refuses a lead's request over one with InvalidArgument.
edition = "2024";

package redoma.relay.v1;

option features.field_presence = IMPLICIT;
option go_package = "github.com/bpalermo/redoma/api/redoma/relay/v1;relayv1";

// Relay is the agents' side of the relay, served to the host Envoy on the
// relay's agent socket over mutual TLS; the client certificate names the
// agent.
service Relay {
  // Connect is an agent's one stream, both ways at once. A second stream of
  // the same agent replaces the first, which ends with Aborted. The request
  // metadata and the response header "redoma-epoch" carry each side's queue
  // epoch.
  rpc Connect(stream Envelope) returns (stream Envelope);
}

// Lead is the lead's side of the relay, on its local lead socket, which only
// the lead's group reaches. Every id it takes and returns is
// "<agent>/<id>".
service Lead {
  // Send queues a Task for an agent, connected or not. It fails with
  // NotFound for an agent not in the allowlist and ResourceExhausted when
  // the agent has 64 open tasks.
  rpc Send(SendRequest) returns (SendResponse);
  // Reply answers a pending Question. It fails with NotFound when no
  // question of that id is pending.
  rpc Reply(ReplyRequest) returns (ReplyResponse);
  // Cancel asks an agent to stop a task, running or queued.
  rpc Cancel(CancelRequest) returns (CancelResponse);
  // Watch streams what the agents send: first the pending questions and the
  // messages held while nobody watched, then everything as it arrives. It
  // runs until the lead ends it; a watch that falls behind loses turn output
  // (with a Dropped event), never questions or messages.
  rpc Watch(WatchRequest) returns (stream WatchEvent);
}

// Envelope is one unit of an agent's stream, in either direction.
message Envelope {
  // The sender's sequence number in this direction, from 1, one more for
  // each envelope it queues. 0 (unset) on an Ack and a Heartbeat, which are
  // neither queued nor acked; any other envelope with 0 is refused.
  uint64 seq = 1;
  // What the envelope carries; exactly one member is set. An envelope with
  // none, or with one its receiver does not take from that side, is dropped.
  oneof body {
    // A task for the agent (relay to agent).
    Task task = 2;
    // The answer to the agent's question (relay to agent).
    Reply reply = 3;
    // A task to stop (relay to agent).
    Cancel cancel = 4;
    // What the sender took of the other side's envelopes (both ways).
    Ack ack = 5;
    // A line of a turn's output, or its end (agent to relay).
    TurnEvent turn_event = 6;
    // A question for the lead (agent to relay).
    Question question = 7;
    // A note for the lead (agent to relay).
    Message message = 8;
    // A sign of life while nothing else moves, every 30 s (agent to relay).
    Heartbeat heartbeat = 9;
  }
}

// Task is one prompt for the agent: one claude turn.
message Task {
  // "<agent>/<random>", made by the relay: 16 lower-case hex digits after
  // the slash. Never empty.
  string id = 1;
  // The prompt, the turn's standard input: 1 byte to 1 MiB.
  string text = 2;
}

// Reply answers the agent's Question of that id.
message Reply {
  // The Question's id as the shim made it, without the agent's name. Never
  // empty.
  string question_id = 1;
  // The lead's answer, what ask_lead returns: 1 byte to 1 MiB.
  string text = 2;
}

// Cancel stops the task: a running turn is killed, a queued one dropped.
// The task's last TurnEvent then says it was cancelled.
message Cancel {
  // The Task's id. Never empty.
  string task_id = 1;
}

// Ack acks every envelope up to seq.
message Ack {
  // The highest sequence number taken from the other side: every envelope
  // up to it is acked, and the other side may forget it. 0 acks nothing.
  uint64 seq = 1;
}

// TurnEvent is one line of the turn's output (claude's stream-json), or its
// end.
message TurnEvent {
  // The Task whose turn this is: one the relay gave this agent and has not
  // closed, or the event is dropped. Never empty.
  string task_id = 1;
  // One line of stream-json, without its newline, or a part of one (see
  // partial). Empty on the last event. At most 192 KiB.
  bytes chunk = 2;
  // True on the turn's last event, after its last chunk; it closes the
  // task. False on every other event.
  bool done = 3;
  // On the last event: why the turn failed, was cancelled or interrupted,
  // at most 4 KiB (the relay cuts a longer one). Empty when claude exited 0,
  // and on every event that is not the last.
  string error = 4;
  // True when the line goes on in the next event's chunk: a line over
  // 192 KiB is sent in parts, every part but the last partial. False on a
  // whole line and on a line's last part.
  bool partial = 5;
}

// Question is the agent asking the lead (ask_lead); its turn waits for the
// Reply.
message Question {
  // Made by the shim, unique within the agent: 1 to 64 of [A-Za-z0-9_-].
  // The lead sees it as "<agent>/<id>".
  string id = 1;
  // The question: 1 byte to 16 KiB.
  string text = 2;
  // The task whose turn asked: one the relay gave this agent and has not
  // closed, or the question is dropped. Never empty.
  string task_id = 3;
}

// Message is the agent telling the lead something (send_message); no reply
// is awaited.
message Message {
  // The recipient: "lead", the only one; any other value is dropped.
  string to = 1;
  // The note: 1 byte to 16 KiB.
  string text = 2;
  // The task whose turn sends it: one the relay gave this agent and has
  // not closed, or the message is dropped. Never empty.
  string task_id = 3;
}

// Heartbeat keeps the stream's hops from timing it out while nothing else
// moves. It has no fields and is never queued or acked.
message Heartbeat {}

// SendRequest queues a task for an agent.
message SendRequest {
  // The agent's name, as the allowlist has it: 1 to 41 of [a-z0-9-],
  // starting with a letter or digit.
  string agent = 1;
  // The prompt: 1 byte to 1 MiB.
  string text = 2;
}

// SendResponse names the task queued.
message SendResponse {
  // "<agent>/<random>", what Cancel takes and the turn's events carry.
  string task_id = 1;
}

// ReplyRequest answers a pending question.
message ReplyRequest {
  // As Watch shows it: "<agent>/<id>".
  string question_id = 1;
  // The answer: 1 byte to 1 MiB.
  string text = 2;
}

// ReplyResponse says the answer is queued for the agent. It has no fields.
message ReplyResponse {}

// CancelRequest stops a task.
message CancelRequest {
  // "<agent>/<random>", as Send returned it.
  string task_id = 1;
}

// CancelResponse says the cancel is queued for the agent. It has no fields.
message CancelResponse {}

// WatchRequest opens a watch.
message WatchRequest {
  // Only this agent's events; empty for every agent's.
  string agent = 1;
}

// WatchEvent is one thing an agent sent, or the relay's note of what it
// dropped.
message WatchEvent {
  // The agent it is from. Never empty.
  string agent = 1;
  // What it is; exactly one member is set.
  oneof body {
    // A line of a turn's output, or its end; its task id is
    // "<agent>/<random>".
    TurnEvent turn_event = 2;
    // A question; its id is "<agent>/<id>", what Reply takes.
    Question question = 3;
    // A note for the lead.
    Message message = 4;
    // What the relay dropped of this agent's envelopes, or, with a reason
    // that says so, that the agent's state is broken and it is refused.
    Dropped dropped = 5;
  }
}

// Dropped says the relay dropped some of the agent's envelopes since the
// last such event: over a limit (a rate, a size, a count), not valid (a task
// the relay did not give it, an id that is not one), or, for turn output, a
// watch that fell behind. Counts are since the last Dropped of that agent to
// this watch. Drops of what an agent sent are reported at most once a
// second per agent.
message Dropped {
  // Turn events dropped; 0 when none.
  uint64 turn_events = 1;
  // Questions dropped; 0 when none.
  uint64 questions = 2;
  // Messages dropped; 0 when none.
  uint64 messages = 3;
  // Envelopes dropped as not valid; 0 when none.
  uint64 invalid = 4;
  // The last reason, for the log. Never empty.
  string reason = 5;
}
